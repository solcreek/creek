name: Publish @solcreek/runtime

on:
  push:
    tags:
      - 'runtime@*'

permissions:
  id-token: write # npm trusted publisher via OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Reads pnpm version from package.json#packageManager.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # Workspace install: tsdown and vitest are root dev deps. A plain
      # `npm install` inside packages/runtime doesn't have them, so the
      # tsdown build fails with "command not found".
      - run: pnpm install

      - run: pnpm turbo build --filter=@solcreek/runtime

      # From the workspace root so vitest is on PATH.
      - run: pnpm vitest run packages/runtime

      # --no-git-checks: CI works on a detached HEAD at the tag.
      - run: pnpm publish --access public --no-git-checks
        working-directory: packages/runtime
